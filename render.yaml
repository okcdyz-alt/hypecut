# Plan de déploiement Render (Blueprint) pour HYPECUT
services:
  - type: web
    name: hypecut
    runtime: docker
    plan: starter           # 512 Mo : 1 clip à la fois ; passer en « standard » si beaucoup de monde
    region: frankfurt       # au plus près des utilisateurs français
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: hypecut-data    # comptes, crédits, vidéos en cours (persistant)
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: MAX_PARALLEL_JOBS
        value: "1"
      - key: CLOUDINARY_URL       # cloudinary://CLE:SECRET@NOM_DU_CLOUD
        sync: false
      - key: STRIPE_SECRET_KEY    # sk_live_… ou sk_test_…
        sync: false
      - key: ANTHROPIC_API_KEY    # pour les titres, légendes et hashtags IA
        sync: false
      - key: ADMIN_EMAILS         # ton e-mail : compte Créateur offert pour tester
        sync: false
